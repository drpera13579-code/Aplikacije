<!DOCTYPE html>
<html lang="sr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📋 Aplikacije za zakazivanje</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #1a237e;
            margin-bottom: 5px;
            font-size: 24px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 15px;
            font-size: 13px;
        }

        .admin-info {
            background: #fff3e0;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0 15px 0;
            text-align: center;
            font-size: 12px;
            border: 1px solid #ffe0b2;
        }

        .admin-info strong {
            color: #e65100;
        }

        .app-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .app-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: #f8f9fa;
            border-radius: 10px;
            text-decoration: none;
            color: #333;
            transition: all 0.2s;
            border-left: 4px solid #1a237e;
        }

        .app-link:hover {
            background: #e8eaf6;
            transform: translateX(5px);
        }

        .app-link .icon {
            font-size: 22px;
        }

        .app-link .info {
            flex: 1;
        }

        .app-link .info .name {
            font-weight: bold;
            font-size: 13px;
        }

        .app-link .info .desc {
            font-size: 10px;
            color: #999;
        }

        .app-link .tag {
            font-size: 7px;
            background: #1a237e;
            color: white;
            padding: 1px 8px;
            border-radius: 10px;
        }

        .footer {
            text-align: center;
            margin-top: 15px;
            font-size: 10px;
            color: #999;
        }

        .version {
            text-align: center;
            font-size: 9px;
            color: #ccc;
            margin-top: 5px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }

            .app-link {
                padding: 8px 10px;
            }

            .app-link .icon {
                font-size: 18px;
            }

            .app-link .info .name {
                font-size: 11px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📋 Aplikacije</h1>
        <p class="subtitle">Izaberite aplikaciju za upravljanje</p>

        <div class="admin-info">
            🔐 <strong>Admin:</strong> admin / admin123
        </div>

        <div class="app-list">
            <!-- MENADŽER SMENA -->
            <a href="menadzer-odeljenja.html" class="app-link">
                <span class="icon">🚑</span>
                <div class="info">
                    <div class="name">Menadžer smena - Odeljenja</div>
                    <div class="desc">Upravljanje smenama po odeljenjima</div>
                </div>
                <span class="tag">NOVO</span>
            </a>

            <!-- DODAĆEMO OSTALE KASNIJE -->
            <div
                style="text-align:center; color:#999; font-size:10px; padding:10px; border-top:1px solid #eee; margin-top:4px;">
                🚀 Još aplikacija uskoro...
            </div>
        </div>

        <div class="footer">
            Sve aplikacije rade bez servera.<br>
            Podaci se čuvaju u localStorage.
        </div>
        <div class="version">v2.0</div>
    </div>
</body>

</html>
